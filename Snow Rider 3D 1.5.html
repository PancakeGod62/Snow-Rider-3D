<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snow Rider 3D - Ultimate Admin Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    canvas { width: 100vw; height: 100vh; display: block; }
    
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.6);
    }
    
    /* Auth Modal Overlay */
    #auth-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 7, 12, 0.85); backdrop-filter: blur(12px);
      z-index: 200; display: flex; justify-content: center; align-items: center;
      pointer-events: auto;
    }
    .auth-card {
      background: rgba(18, 22, 32, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px; padding: 28px; width: 320px; color: #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 14px;
    }
    .auth-card h2 { margin: 0; font-size: 22px; text-align: center; color: #00ffb4; }
    .auth-card input {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 10px; border-radius: 6px; outline: none; font-size: 14px;
    }
    .auth-card button {
      background: #2e7d32; color: #fff; border: none; padding: 10px;
      font-weight: 800; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    .auth-card button:hover { background: #388e3c; }
    .auth-toggle { font-size: 12px; text-align: center; color: #aaa; cursor: pointer; }
    .auth-toggle span { color: #00ffb4; text-decoration: underline; }
    #auth-error { color: #ff5252; font-size: 12px; text-align: center; display: none; }

    /* Start Screen Menu */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      z-index: 150; display: flex; flex-direction: column;
      justify-content: center; align-items: center; pointer-events: auto;
    }
    #start-title {
      color: #ffffff; font-size: 64px; font-weight: 900; letter-spacing: -1px;
      text-shadow: 0 5px 25px rgba(0, 255, 180, 0.4); margin-bottom: 8px; text-transform: uppercase;
    }
    #start-subtitle {
      color: #00ffb4; font-size: 16px; font-weight: 700; letter-spacing: 3px;
      margin-bottom: 30px; text-transform: uppercase;
    }
    #play-btn {
      background: #00ffb4; color: #0b0f19; border: none; padding: 16px 48px;
      font-size: 22px; font-weight: 900; border-radius: 40px; cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 180, 0.6); transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    #play-btn:hover {
      transform: scale(1.08); background: #33ffc4;
      box-shadow: 0 0 45px rgba(0, 255, 180, 0.9);
    }

    #user-tag {
      position: absolute; top: 25px; right: 25px; pointer-events: auto;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 8px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); color: #fff;
      font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px;
    }
    #logout-btn {
      background: #d32f2f; color: #fff; border: none; padding: 4px 8px;
      border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 800;
    }

    #gift-counter {
      position: absolute; top: 25px; left: 25px;
      color: #fff; font-size: 26px; font-weight: 800;
      display: flex; align-items: center; gap: 10px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    #gift-icon {
      width: 28px; height: 28px; background: #d32f2f; border-radius: 4px;
      position: relative; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }
    #gift-icon::before { content: ''; position: absolute; top: 0; left: 10px; width: 8px; height: 100%; background: #ffd700; }
    #gift-icon::after { content: ''; position: absolute; top: 10px; left: 0; width: 100%; height: 8px; background: #ffd700; }

    #score-container { position: absolute; bottom: 35px; left: 35px; display: flex; flex-direction: column; }
    #score-display { color: #ffffff; font-size: 80px; font-weight: 900; line-height: 0.9; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }
    #high-score-display { color: #ffca28; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

    #speed-display {
      position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
      color: #ffca28; font-size: 20px; font-weight: 800; letter-spacing: 2px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.8); background: rgba(0,0,0,0.5);
      padding: 6px 18px; border-radius: 20px; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    #garage {
      position: absolute; top: 75px; right: 25px; pointer-events: auto;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
      padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 160;
    }
    #garage select {
      background: rgba(20,20,20,0.9); color: #fff; font-size: 13px; font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2); outline: none; cursor: pointer; padding: 6px 10px; border-radius: 5px;
    }
    #buy-btn {
      background: #2e7d32; color: #fff; border: none; padding: 6px 12px;
      font-size: 12px; font-weight: 800; border-radius: 5px; cursor: pointer;
      display: none; transition: background 0.2s; width: 100%;
    }

    /* Leaderboard UI */
    #leaderboard {
      position: absolute; top: 75px; left: 25px; pointer-events: auto;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
      padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.3);
      display: flex; flex-direction: column; gap: 8px; min-width: 200px; z-index: 160;
    }
    #leaderboard-title {
      color: #ffd700; font-size: 13px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; border-bottom: 1px solid rgba(255,215,0,0.2); padding-bottom: 4px;
    }
    #leaderboard-list {
      display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none;
    }
    .lb-row {
      display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #eee;
    }
    .lb-row span.lb-gifts { color: #00ffb4; }

    /* Admin Console */
    #admin-panel {
      position: absolute; bottom: 20px; right: 20px; width: 480px;
      background: rgba(10, 12, 18, 0.95); border: 1px solid rgba(0, 255, 180, 0.5);
      border-radius: 8px; padding: 12px; pointer-events: auto; z-index: 170;
      backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      display: none; flex-direction: column; gap: 8px;
    }
    #admin-header {
      color: #00ffb4; font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; border-bottom: 1px solid rgba(0,255,180,0.3); padding-bottom: 4px;
    }
    #admin-logs {
      height: 180px; overflow-y: auto; color: #aaa; font-family: monospace;
      font-size: 11px; display: flex; flex-direction: column; gap: 3px;
    }
    #admin-input {
      background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(0, 255, 180, 0.4);
      color: #00ffb4; font-family: monospace; font-size: 12px; padding: 6px 8px;
      border-radius: 4px; outline: none;
    }
  </style>
  <script src="https://code.playcanvas.com/playcanvas-latest.min.js"></script>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2 id="auth-title">LOG IN</h2>
      <div id="auth-error"></div>
      <input type="text" id="username-input" placeholder="Username" />
      <input type="password" id="password-input" placeholder="Password" />
      <button id="auth-submit">LOG IN</button>
      <div class="auth-toggle" id="auth-toggle">Need an account? <span>Sign Up</span></div>
    </div>
  </div>

  <!-- Start Screen Menu -->
  <div id="start-screen">
    <div id="start-title">Snow Rider 3D</div>
    <div id="start-subtitle">Select your cart & hit the slopes</div>
    <button id="play-btn">PLAY GAME</button>
  </div>

  <div id="ui-layer">
    <div id="user-tag">
      <span id="player-display-name">Player</span>
      <button id="logout-btn">Log Out</button>
    </div>

    <div id="gift-counter">
      <div id="gift-icon"></div>
      <span id="gifts">0</span>
    </div>

    <div id="speed-display"><span id="speed-num">32</span> MPH</div>

    <div id="score-container">
      <div id="score-display"><span id="score">0</span></div>
      <div id="high-score-display">BEST SCORE: <span id="high-score">0</span></div>
    </div>

    <!-- Leaderboard Container -->
    <div id="leaderboard">
      <div id="leaderboard-title">🏆 Top Gift Collectors</div>
      <ul id="leaderboard-list"></ul>
    </div>

    <div id="garage">
      <select id="sledSelect"></select>
      <button id="buy-btn">BUY CART</button>
    </div>

    <div id="admin-panel">
      <div id="admin-header">⚡ Extended Console (Press ~ or / to toggle)</div>
      <div id="admin-logs">
        <div style="color: #ffd700;">Type /help to display all available commands.</div>
      </div>
      <input type="text" id="admin-input" placeholder="Type command here..." />
    </div>
  </div>

  <canvas id="application"></canvas>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let accounts = JSON.parse(localStorage.getItem('sr_accounts') || '{}');
      let currentUser = localStorage.getItem('sr_current_user') || null;
      let isAuthModeLogin = true;
      let gameStarted = false;

      const authOverlay = document.getElementById('auth-overlay');
      const authTitle = document.getElementById('auth-title');
      const authSubmit = document.getElementById('auth-submit');
      const authToggle = document.getElementById('auth-toggle');
      const authError = document.getElementById('auth-error');
      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');
      const logoutBtn = document.getElementById('logout-btn');
      const playerDisplayName = document.getElementById('player-display-name');
      const startScreen = document.getElementById('start-screen');
      const playBtn = document.getElementById('play-btn');

      function saveAccounts() {
        localStorage.setItem('sr_accounts', JSON.stringify(accounts));
        updateLeaderboardUI();
      }

      function updateLeaderboardUI() {
        const lbList = document.getElementById('leaderboard-list');
        lbList.innerHTML = '';
        
        const sorted = Object.keys(accounts).map(user => {
          return { name: user, gifts: accounts[user].gifts || 0 };
        }).sort((a, b) => b.gifts - a.gifts).slice(0, 5);

        sorted.forEach((p, idx) => {
          const li = document.createElement('li');
          li.className = 'lb-row';
          li.innerHTML = `<span>#${idx+1}${p.name}</span><span class="lb-gifts">${p.gifts} 🎁</span>`;
          lbList.appendChild(li);
        });
      }

      function loadUserData() {
        if (!currentUser || !accounts[currentUser]) return;
        const data = accounts[currentUser];

        if (currentUser.toLowerCase() === 'vethum62') {
          data.isOp = true;
        }

        giftCount = data.gifts || 0;
        highScore = data.highScore || 0;
        unlockedCarts = data.unlocked || ['wooden'];

        document.getElementById('gifts').innerText = giftCount;
        document.getElementById('high-score').innerText = highScore;
        playerDisplayName.innerText = currentUser + (data.isOp ? " [OP]" : "");
        updateGarageUI();
        updateLeaderboardUI();
      }

      function saveUserData() {
        if (!currentUser || !accounts[currentUser]) return;
        accounts[currentUser].gifts = giftCount;
        accounts[currentUser].highScore = highScore;
        accounts[currentUser].unlocked = unlockedCarts;
        saveAccounts();
      }

      playBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameStarted = true;
      });

      authToggle.addEventListener('click', () => {
        isAuthModeLogin = !isAuthModeLogin;
        authTitle.innerText = isAuthModeLogin ? 'LOG IN' : 'SIGN UP';
        authSubmit.innerText = isAuthModeLogin ? 'LOG IN' : 'CREATE ACCOUNT';
        authToggle.innerHTML = isAuthModeLogin ? 'Need an account? <span>Sign Up</span>' : 'Already have an account? <span>Log In</span>';
        authError.style.display = 'none';
      });

      authSubmit.addEventListener('click', () => {
        const user = usernameInput.value.trim();
        const pass = passwordInput.value.trim();

        if (!user || !pass) {
          authError.innerText = "Fields cannot be empty.";
          authError.style.display = 'block';
          return;
        }

        if (isAuthModeLogin) {
          if (accounts[user] && accounts[user].password === pass) {
            currentUser = user;
            localStorage.setItem('sr_current_user', currentUser);
            authOverlay.style.display = 'none';
            loadUserData();
          } else {
            authError.innerText = "Invalid username or password.";
            authError.style.display = 'block';
          }
        } else {
          if (accounts[user]) {
            authError.innerText = "Username already exists.";
            authError.style.display = 'block';
          } else {
            accounts[user] = {
              password: pass,
              gifts: 0,
              highScore: 0,
              unlocked: ['wooden'],
              isOp: user.toLowerCase() === 'vethum62'
            };
            currentUser = user;
            saveAccounts();
            localStorage.setItem('sr_current_user', currentUser);
            authOverlay.style.display = 'none';
            loadUserData();
          }
        }
      });

      logoutBtn.addEventListener('click', () => {
        saveUserData();
        localStorage.removeItem('sr_current_user');
        location.reload();
      });

      if (currentUser && accounts[currentUser]) {
        authOverlay.style.display = 'none';
      }

      let giftCount = 0;
      let highScore = 0;
      let unlockedCarts = ['wooden'];

      const canvas = document.getElementById('application');
      const app = new pc.Application(canvas, {
        keyboard: new pc.Keyboard(window)
      });

      app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
      app.setCanvasResolution(pc.RESOLUTION_AUTO);
      window.addEventListener('resize', () => app.resizeCanvas());

      app.scene.gammaCorrection = pc.GAMMA_SRGB;
      app.scene.toneMapping = pc.TONEMAP_ACES;

      app.scene.fog = pc.FOG_EXP2;
      app.scene.fogColor = new pc.Color(0.75, 0.85, 0.95);
      app.scene.fogDensity = 0.003;

      const sun = new pc.Entity('sun');
      sun.addComponent('light', {
        type: 'directional',
        color: new pc.Color(1.0, 0.9, 0.78),
        intensity: 2.2,
        castShadows: true,
        shadowBias: 0.02,
        shadowDistance: 180,
        shadowResolution: 2048
      });
      sun.setEulerAngles(28, 40, 0);
      app.root.addChild(sun);

      app.scene.ambientLight = new pc.Color(0.4, 0.48, 0.6);

      const camera = new pc.Entity('camera');
      camera.addComponent('camera', {
        clearColor: new pc.Color(0.75, 0.85, 0.95),
        farClip: 1000,
        fov: 62
      });
      app.root.addChild(camera);

      // Materials
      const snowMat = new pc.StandardMaterial();
      snowMat.diffuse = new pc.Color(0.92, 0.95, 0.98);
      snowMat.shininess = 80;
      snowMat.update();

      const woodMat = new pc.StandardMaterial();
      woodMat.diffuse = new pc.Color(0.38, 0.22, 0.12);
      woodMat.shininess = 15;
      woodMat.update();

      const steelMat = new pc.StandardMaterial();
      steelMat.diffuse = new pc.Color(0.7, 0.73, 0.76);
      steelMat.metalness = 0.9;
      steelMat.shininess = 90;
      steelMat.useMetalness = true;
      steelMat.update();

      const needleMat = new pc.StandardMaterial();
      needleMat.diffuse = new pc.Color(0.06, 0.18, 0.08);
      needleMat.shininess = 10;
      needleMat.update();

      const giftMat = new pc.StandardMaterial();
      giftMat.diffuse = new pc.Color(0.8, 0.1, 0.1);
      giftMat.shininess = 60;
      giftMat.update();

      const goldMat = new pc.StandardMaterial();
      goldMat.diffuse = new pc.Color(0.95, 0.75, 0.15);
      goldMat.metalness = 0.85;
      goldMat.shininess = 90;
      goldMat.useMetalness = true;
      goldMat.update();

      const carbonMat = new pc.StandardMaterial();
      carbonMat.diffuse = new pc.Color(0.12, 0.12, 0.14);
      carbonMat.shininess = 85;
      carbonMat.update();

      const adminMat = new pc.StandardMaterial();
      adminMat.diffuse = new pc.Color(0, 0.9, 0.8);
      adminMat.emissive = new pc.Color(0, 0.6, 0.5);
      adminMat.shininess = 100;
      adminMat.update();

      const redForgedMat = new pc.StandardMaterial();
      redForgedMat.diffuse = new pc.Color(0.6, 0.05, 0.08);
      redForgedMat.emissive = new pc.Color(0.3, 0.02, 0.04);
      redForgedMat.shininess = 95;
      redForgedMat.update();

      const titaniumMat = new pc.StandardMaterial();
      titaniumMat.diffuse = new pc.Color(0.5, 0.55, 0.62);
      titaniumMat.metalness = 0.95;
      titaniumMat.shininess = 95;
      titaniumMat.useMetalness = true;
      titaniumMat.update();

      const phoenixMat = new pc.StandardMaterial();
      phoenixMat.diffuse = new pc.Color(0.9, 0.35, 0.0);
      phoenixMat.emissive = new pc.Color(0.5, 0.15, 0.0);
      phoenixMat.shininess = 100;
      phoenixMat.update();

      // Sled & Player
      const playerGroup = new pc.Entity('playerGroup');
      app.root.addChild(playerGroup);

      const sledMesh = new pc.Entity('sledMesh');

      const r1 = new pc.Entity();
      r1.addComponent('render', { type: 'box', castShadows: true });
      r1.render.meshInstances[0].material = steelMat;
      r1.setLocalScale(0.1, 0.15, 3.6);
      r1.setLocalPosition(-0.65, 0.1, -1.2);
      sledMesh.addChild(r1);

      const r2 = new pc.Entity();
      r2.addComponent('render', { type: 'box', castShadows: true });
      r2.render.meshInstances[0].material = steelMat;
      r2.setLocalScale(0.1, 0.15, 3.6);
      r2.setLocalPosition(0.65, 0.1, -1.2);
      sledMesh.addChild(r2);

      const seatPlanks = [];
      for (let p = 0; p < 6; p++) {
        const plank = new pc.Entity();
        plank.addComponent('render', { type: 'box', castShadows: true });
        plank.render.meshInstances[0].material = woodMat;
        plank.setLocalScale(1.4, 0.06, 0.4);
        plank.setLocalPosition(0, 0.28, -0.2 - (p * 0.42));
        sledMesh.addChild(plank);
        seatPlanks.push(plank);
      }
      playerGroup.addChild(sledMesh);

      let globalGodmode = false;
      let speedMult = 1.0;
      let jumpPowerMult = 1.0;
      let gravityValue = -36;
      let activeScale = 1.0;
      let cameraFovOverride = 0;
      let invertControls = false;
      let giftMagnetMode = false;

      const sledTypes = {
        wooden:    { name: "🌲 Rustic Timber", cost: 0, baseSpeed: 32, jump: 13, mat: woodMat, immune: false },
        santa:     { name: "🎅 Crimson Sleigh", cost: 50, baseSpeed: 42, jump: 12, mat: giftMat, immune: false },
        modern:    { name: "⚡ Steel Alpine", cost: 100, baseSpeed: 30, jump: 18, mat: steelMat, immune: false },
        rocket:    { name: "🚀 Rocket Sled", cost: 200, baseSpeed: 55, jump: 11, mat: steelMat, immune: false },
        gold:      { name: "🏆 Golden Flyer", cost: 350, baseSpeed: 34, jump: 22, mat: goldMat, immune: false },
        carbon:    { name: "🛷 Carbon Fiber", cost: 500, baseSpeed: 38, jump: 15, mat: carbonMat, immune: false },
        admincart: { name: "🛡️ GOD CART (Cyan)", cost: 0, baseSpeed: 50, jump: 25, mat: adminMat, immune: true },
        redforged: { name: "🔥 RED FORGED CARBON", cost: 0, baseSpeed: 58, jump: 26, mat: redForgedMat, immune: true },
        titanium:  { name: "⚙️ TITANIUM BEAST", cost: 0, baseSpeed: 62, jump: 28, mat: titaniumMat, immune: true },
        phoenix:   { name: "🦅 PHOENIX INFERNO", cost: 0, baseSpeed: 65, jump: 30, mat: phoenixMat, immune: true }
      };

      let currentSledKey = 'wooden';
      let currentSled = sledTypes.wooden;

      const sledSelect = document.getElementById('sledSelect');
      const buyBtn = document.getElementById('buy-btn');

      function updateGarageUI() {
        sledSelect.innerHTML = '';
        Object.keys(sledTypes).forEach(key => {
          const isUnlocked = unlockedCarts.includes(key);
          const cart = sledTypes[key];
          if (['admincart', 'redforged', 'titanium', 'phoenix'].includes(key) && !isUnlocked) return;

          const opt = document.createElement('option');
          opt.value = key;
          opt.innerText = isUnlocked ? `${cart.name} (Unlocked)` : `${cart.name} (${cart.cost} Gifts)`;
          sledSelect.appendChild(opt);
        });

        sledSelect.value = currentSledKey;
        const activeUnlocked = unlockedCarts.includes(currentSledKey);
        buyBtn.style.display = activeUnlocked ? 'none' : 'block';
        if (!activeUnlocked) {
          buyBtn.innerText = `BUY (${sledTypes[currentSledKey].cost} GIFTS)`;
        }
      }

      sledSelect.addEventListener('change', (e) => {
        currentSledKey = e.target.value;
        const isUnlocked = unlockedCarts.includes(currentSledKey);
        if (isUnlocked) {
          currentSled = sledTypes[currentSledKey];
          seatPlanks.forEach(p => p.render.meshInstances[0].material = currentSled.mat);
        }
        updateGarageUI();
      });

      buyBtn.addEventListener('click', () => {
        const cart = sledTypes[currentSledKey];
        if (giftCount >= cart.cost) {
          giftCount -= cart.cost;
          unlockedCarts.push(currentSledKey);
          currentSled = cart;
          seatPlanks.forEach(p => p.render.meshInstances[0].material = currentSled.mat);
          saveUserData();
          document.getElementById('gifts').innerText = giftCount;
          updateGarageUI();
        } else {
          alert(`Not enough gifts! You need ${cart.cost - giftCount} more gifts.`);
        }
      });

      // COMMAND SYSTEM
      const adminPanel = document.getElementById('admin-panel');
      const adminInput = document.getElementById('admin-input');
      const adminLogs = document.getElementById('admin-logs');

      function logAdmin(msg, color="#00ffb4") {
        const div = document.createElement('div');
        div.style.color = color;
        div.innerText = "> " + msg;
        adminLogs.appendChild(div);
        adminLogs.scrollTop = adminLogs.scrollHeight;
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === '`' || e.key === '~' || (e.key === '/' && document.activeElement !== adminInput)) {
          e.preventDefault();
          const isVisible = adminPanel.style.display === 'flex';
          adminPanel.style.display = isVisible ? 'none' : 'flex';
          if (!isVisible) adminInput.focus();
        }
      });

      adminInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const raw = adminInput.value.trim();
          adminInput.value = '';
          if (!raw) return;

          logAdmin(raw, '#ffffff');

          const isOp = currentUser && accounts[currentUser] && accounts[currentUser].isOp;
          if (!isOp) {
            logAdmin("ACCESS DENIED: Only OPs can execute commands.", "#ff4444");
            return;
          }

          const parts = raw.split(' ');
          const cmd = parts[0].toLowerCase();
          const arg = parts[1];
          const arg2 = parts[2];

          // MASSIVE COMMAND LIBRARY
          if (cmd === '/help') {
            logAdmin("=== ADMINISTRATIVE COMMANDS ===", "#ffd700");
            logAdmin("/op [@e | username] | /op off [@e | username]");
            logAdmin("/deop [username] | /getpass [username | @e]");
            logAdmin("/clearlogs | /users | /resetaccount [user]");
            logAdmin("=== INVENTORY & ECONOMY ===", "#ffd700");
            logAdmin("/give [cart] | /unlockall | /relockall");
            logAdmin("/addgifts [num] | /setgifts [num] | /cleargifts");
            logAdmin("=== SCORE & PERFORMANCE ===", "#ffd700");
            logAdmin("/setscore [num] | /addscore [num] | /resetscore");
            logAdmin("=== PHYSICS & CHEATS ===", "#ffd700");
            logAdmin("/godmode [on/off] | /speed [mult] | /jump [mult]");
            logAdmin("/gravity [val] | /scale [mult] | /magnet [on/off]");
            logAdmin("/invert [on/off] | /fly [on/off] | /tp [x] [y] [z]");
            logAdmin("=== ENVIRONMENT & VISUALS ===", "#ffd700");
            logAdmin("/time [day|sunset|night] | /fog [density]");
            logAdmin("/fogcolor [r] [g] [b] | /fov [val] | /snow [color]");
            logAdmin("=== WORLD SPANNING & MANIPULATION ===", "#ffd700");
            logAdmin("/cleartrees | /cleargifts | /clearramps | /nuke");
            logAdmin("/explode | /restart");
          }
          else if (cmd === '/op') {
            if (arg === 'off') {
              if (arg2 === '@e') {
                Object.keys(accounts).forEach(user => {
                  if (user !== currentUser) accounts[user].isOp = false;
                });
                saveAccounts();
                playerDisplayName.innerText = currentUser + " [OP]";
                logAdmin(`SUCCESS: Revoked OP from all users except ${currentUser}.`);
              } else if (arg2 && accounts[arg2]) {
                accounts[arg2].isOp = false;
                saveAccounts();
                logAdmin(`SUCCESS: Revoked OP from '${arg2}'.`);
              } else {
                logAdmin("Usage: /op off [@e | username]", "#ffbb00");
              }
            } else if (arg === '@e') {
              Object.keys(accounts).forEach(user => accounts[user].isOp = true);
              saveAccounts();
              playerDisplayName.innerText = currentUser + " [OP]";
              logAdmin("SUCCESS: All players are now OP!");
            } else if (arg && accounts[arg]) {
              accounts[arg].isOp = true;
              saveAccounts();
              logAdmin(`SUCCESS: ${arg} is now an OP!`);
            } else {
              logAdmin("Usage: /op [@e | username] OR /op off [@e | username]", "#ffbb00");
            }
          }
          else if (cmd === '/deop') {
            if (arg && accounts[arg]) {
              accounts[arg].isOp = false;
              saveAccounts();
              logAdmin(`SUCCESS: ${arg} is no longer an OP.`);
            } else {
              logAdmin("Account not found.", "#ff4444");
            }
          }
          else if (cmd === '/getpass') {
            if (currentUser.toLowerCase() !== 'vethum62') {
              logAdmin("ACCESS DENIED: Credentials inspector restricted strictly to 'Vethum62'.", "#ff4444");
            } else {
              if (arg === '@e') {
                logAdmin("=== USER CREDENTIALS LIST ===", "#00ffb4");
                Object.keys(accounts).forEach(u => {
                  logAdmin(`User: ${u} | Pass: ${accounts[u].password}`, "#ffd700");
                });
              } else if (arg && accounts[arg]) {
                logAdmin(`User: ${arg} | Pass: ${accounts[arg].password}`, "#ffd700");
              } else {
                logAdmin("Usage: /getpass [username | @e]", "#ffbb00");
              }
            }
          }
          else if (cmd === '/clearlogs') {
            adminLogs.innerHTML = '';
          }
          else if (cmd === '/users') {
            logAdmin("Registered Users: " + Object.keys(accounts).join(', '), "#00ffb4");
          }
          else if (cmd === '/resetaccount') {
            if (arg && accounts[arg]) {
              accounts[arg].gifts = 0;
              accounts[arg].highScore = 0;
              accounts[arg].unlocked = ['wooden'];
              saveAccounts();
              if (arg === currentUser) loadUserData();
              logAdmin(`Account '${arg}' reset to default states.`);
            } else {
              logAdmin("User not found.", "#ff4444");
            }
          }
          else if (cmd === '/give') {
            if (sledTypes[arg]) {
              if (!unlockedCarts.includes(arg)) unlockedCarts.push(arg);
              currentSledKey = arg;
              currentSled = sledTypes[arg];
              seatPlanks.forEach(p => p.render.meshInstances[0].material = currentSled.mat);
              saveUserData();
              updateGarageUI();
              logAdmin(`SUCCESS: Equipped ${sledTypes[arg].name}!`);
            } else {
              logAdmin("Invalid cart ID. Types: " + Object.keys(sledTypes).join(', '), "#ff4444");
            }
          }
          else if (cmd === '/unlockall') {
            unlockedCarts = Object.keys(sledTypes);
            saveUserData();
            updateGarageUI();
            logAdmin("SUCCESS: Unlocked every cart in the game!");
          }
          else if (cmd === '/relockall') {
            unlockedCarts = ['wooden'];
            currentSledKey = 'wooden';
            currentSled = sledTypes.wooden;
            seatPlanks.forEach(p => p.render.meshInstances[0].material = currentSled.mat);
            saveUserData();
            updateGarageUI();
            logAdmin("SUCCESS: Relocked all carts except Rustic Timber.");
          }
          else if (cmd === '/addgifts') {
            const amount = parseInt(arg || '100', 10);
            giftCount += amount;
            document.getElementById('gifts').innerText = giftCount;
            saveUserData();
            logAdmin(`SUCCESS: Added ${amount} gifts!`);
          }
          else if (cmd === '/setgifts') {
            giftCount = parseInt(arg || '0', 10);
            document.getElementById('gifts').innerText = giftCount;
            saveUserData();
            logAdmin(`Gifts set to ${giftCount}.`);
          }
          else if (cmd === '/cleargifts') {
            giftCount = 0;
            document.getElementById('gifts').innerText = giftCount;
            saveUserData();
            logAdmin("Cleared all collected gifts.");
          }
          else if (cmd === '/setscore') {
            highScore = parseInt(arg || '0', 10);
            document.getElementById('high-score').innerText = highScore;
            saveUserData();
            logAdmin(`SUCCESS: High score set to ${highScore}!`);
          }
          else if (cmd === '/addscore') {
            score += parseInt(arg || '10', 10);
            document.getElementById('score').innerText = score;
            if (score > highScore) {
              highScore = score;
              document.getElementById('high-score').innerText = highScore;
              saveUserData();
            }
            logAdmin(`Added score points. Current score: ${score}`);
          }
          else if (cmd === '/resetscore') {
            score = 0;
            document.getElementById('score').innerText = score;
            logAdmin("Current run score reset to 0.");
          }
          else if (cmd === '/godmode') {
            globalGodmode = (arg === 'on');
            logAdmin(`Godmode set to: ${globalGodmode}`);
          }
          else if (cmd === '/speed') {
            speedMult = parseFloat(arg || '1.0');
            logAdmin(`Speed multiplier set to: ${speedMult}x`);
          }
          else if (cmd === '/jump') {
            jumpPowerMult = parseFloat(arg || '1.0');
            logAdmin(`Jump multiplier set to: ${jumpPowerMult}x`);
          }
          else if (cmd === '/gravity') {
            gravityValue = parseFloat(arg || '-36');
            logAdmin(`Gravity value set to: ${gravityValue}`);
          }
          else if (cmd === '/scale') {
            activeScale = parseFloat(arg || '1.0');
            playerGroup.setLocalScale(activeScale, activeScale, activeScale);
            logAdmin(`Player scale set to: ${activeScale}x`);
          }
          else if (cmd === '/magnet') {
            giftMagnetMode = (arg === 'on');
            logAdmin(`Gift Magnet set to: ${giftMagnetMode}`);
          }
          else if (cmd === '/invert') {
            invertControls = (arg === 'on');
            logAdmin(`Invert Controls set to: ${invertControls}`);
          }
          else if (cmd === '/fly') {
            if (arg === 'on') {
              gravityValue = 0;
              yVelocity = 0;
              logAdmin("Flight enabled! Adjust elevation with jump or gravity command.");
            } else {
              gravityValue = -36;
              logAdmin("Flight disabled.");
            }
          }
          else if (cmd === '/tp') {
            const tx = parseFloat(arg || '0');
            const ty = parseFloat(arg2 || '0');
            const tz = parseFloat(parts[3] || '0');
            playerGroup.setPosition(tx, ty, tz);
            logAdmin(`Teleported player to: ${tx}, ${ty}, ${tz}`);
          }
          else if (cmd === '/time') {
            if (arg === 'sunset') {
              sun.setEulerAngles(10, 80, 0);
              app.scene.fogColor = new pc.Color(0.85, 0.45, 0.35);
              logAdmin("Time set to Sunset.");
            } else if (arg === 'night') {
              sun.setEulerAngles(-20, 40, 0);
              app.scene.fogColor = new pc.Color(0.05, 0.08, 0.15);
              logAdmin("Time set to Night.");
            } else {
              sun.setEulerAngles(28, 40, 0);
              app.scene.fogColor = new pc.Color(0.75, 0.85, 0.95);
              logAdmin("Time set to Day.");
            }
          }
          else if (cmd === '/fog') {
            const density = parseFloat(arg || '0.003');
            app.scene.fogDensity = density;
            logAdmin(`Fog density set to: ${density}`);
          }
          else if (cmd === '/fogcolor') {
            const r = parseFloat(arg || '0.75');
            const g = parseFloat(arg2 || '0.85');
            const b = parseFloat(parts[3] || '0.95');
            app.scene.fogColor = new pc.Color(r, g, b);
            logAdmin(`Fog color updated to RGB(${r}, ${g}, ${b}).`);
          }
          else if (cmd === '/fov') {
            cameraFovOverride = parseFloat(arg || '0');
            logAdmin(cameraFovOverride > 0 ? `FOV override set to ${cameraFovOverride}` : "FOV set to dynamic.");
          }
          else if (cmd === '/snow') {
            if (arg === 'red') snowMat.diffuse = new pc.Color(0.9, 0.2, 0.2);
            else if (arg === 'gold') snowMat.diffuse = new pc.Color(0.9, 0.8, 0.2);
            else if (arg === 'black') snowMat.diffuse = new pc.Color(0.1, 0.1, 0.1);
            else snowMat.diffuse = new pc.Color(0.92, 0.95, 0.98);
            snowMat.update();
            logAdmin(`Snow material color changed.`);
          }
          else if (cmd === '/cleartrees') {
            obstacles.forEach(t => app.root.removeChild(t));
            obstacles.length = 0;
            logAdmin("Cleared all obstacle trees.");
          }
          else if (cmd === '/cleargifts') {
            gifts.forEach(g => app.root.removeChild(g));
            gifts.length = 0;
            logAdmin("Cleared all gifts from terrain.");
          }
          else if (cmd === '/clearramps') {
            ramps.forEach(r => app.root.removeChild(r));
            ramps.length = 0;
            logAdmin("Cleared all ramps.");
          }
          else if (cmd === '/nuke') {
            obstacles.forEach(t => app.root.removeChild(t));
            obstacles.length = 0;
            gifts.forEach(g => app.root.removeChild(g));
            gifts.length = 0;
            ramps.forEach(r => app.root.removeChild(r));
            ramps.length = 0;
            logAdmin("Nuked all world obstacles, gifts, and ramps!");
          }
          else if (cmd === '/explode') {
            triggerCrashAnimation();
            logAdmin("Detonated sled payload!");
          }
          else if (cmd === '/restart') {
            location.reload();
          }
          else {
            logAdmin("Unknown command. Type /help to view commands.", "#ff4444");
          }
        }
      });

      // Ground Chunks
      const grounds = [];
      for (let i = 0; i < 6; i++) {
        const g = new pc.Entity('ground_' + i);
        g.addComponent('render', { type: 'box', receiveShadows: true });
        g.render.meshInstances[0].material = snowMat;
        g.setLocalScale(60, 0.1, 120);
        g.setPosition(0, -0.05, -i * 120);
        app.root.addChild(g);
        grounds.push(g);
      }

      // World Objects
      const obstacles = [];
      const borderTrees = [];
      const gifts = [];
      const ramps = [];
      const brokenDebris = [];

      function createTree(x, z, isBorder = false) {
        const tree = new pc.Entity('tree');
        tree.setPosition(x, 0, z);

        const trunk = new pc.Entity();
        trunk.addComponent('render', { type: 'cylinder', castShadows: true });
        trunk.render.meshInstances[0].material = woodMat;
        trunk.setLocalScale(0.8, 5, 0.8);
        trunk.setLocalPosition(0, 2.5, 0);
        tree.addChild(trunk);

        for (let i = 0; i < 5; i++) {
          const scale = 4.8 - i * 0.85;
          const foliage = new pc.Entity();
          foliage.addComponent('render', { type: 'cone', castShadows: true });
          foliage.render.meshInstances[0].material = needleMat;
          foliage.setLocalScale(scale, 2.4, scale);
          foliage.setLocalPosition(0, 2.2 + i * 1.2, 0);
          tree.addChild(foliage);

          const snowLayer = new pc.Entity();
          snowLayer.addComponent('render', { type: 'cone', castShadows: true });
          snowLayer.render.meshInstances[0].material = snowMat;
          snowLayer.setLocalScale(scale * 0.8, 0.9, scale * 0.8);
          snowLayer.setLocalPosition(0, 2.7 + i * 1.2, 0);
          tree.addChild(snowLayer);
        }

        tree.passed = false;
        app.root.addChild(tree);
        if (isBorder) {
          borderTrees.push(tree);
        } else {
          obstacles.push(tree);
        }
      }

      function createGift(x, z) {
        const gGroup = new pc.Entity('gift');
        gGroup.setPosition(x, 0.8, z);

        const box = new pc.Entity();
        box.addComponent('render', { type: 'box', castShadows: true });
        box.render.meshInstances[0].material = giftMat;
        box.setLocalScale(1.4, 1.4, 1.4);
        gGroup.addChild(box);

        const rib1 = new pc.Entity();
        rib1.addComponent('render', { type: 'box', castShadows: true });
        rib1.render.meshInstances[0].material = goldMat;
        rib1.setLocalScale(1.45, 1.45, 0.28);
        gGroup.addChild(rib1);

        const rib2 = new pc.Entity();
        rib2.addComponent('render', { type: 'box', castShadows: true });
        rib2.render.meshInstances[0].material = goldMat;
        rib2.setLocalScale(0.28, 1.45, 1.45);
        gGroup.addChild(rib2);

        app.root.addChild(gGroup);
        gifts.push(gGroup);
      }

      function createRamp(x, z) {
        const ramp = new pc.Entity('ramp');
        ramp.addComponent('render', { type: 'box', castShadows: true, receiveShadows: true });
        ramp.render.meshInstances[0].material = snowMat;
        ramp.setLocalScale(6, 1.2, 7);
        ramp.setEulerAngles(-20, 0, 0);
        ramp.setPosition(x, 0.3, z);
        app.root.addChild(ramp);
        ramps.push(ramp);
      }

      // Generate initial track and outer border trees
      for (let z = 0; z > -450; z -= 12) {
        createTree(-26, z, true);
        createTree(-23, z + 6, true);
        createTree(23, z + 6, true);
        createTree(26, z, true);
      }

      for (let z = -30; z > -400; z -= 7) {
        const x = (Math.random() - 0.5) * 36;
        const rand = Math.random();
        if (rand < 0.75) createTree(x, z);
        else if (rand < 0.9) createGift(x, z);
        else createRamp(x, z);
      }

      // Break Sled Animation Logic
      function triggerCrashAnimation() {
        if (gameOver) return;
        gameOver = true;
        saveUserData();

        const origin = playerGroup.getPosition().clone();
        sledMesh.enabled = false;

        // Break into flying fragments
        for (let i = 0; i < 12; i++) {
          const piece = new pc.Entity('debris_' + i);
          piece.addComponent('render', { type: 'box', castShadows: true });
          
          if (i < 2) {
            piece.render.meshInstances[0].material = steelMat;
            piece.setLocalScale(0.1, 0.15, 1.8);
          } else {
            piece.render.meshInstances[0].material = currentSled.mat;
            piece.setLocalScale(0.6, 0.06, 0.4);
          }

          piece.setPosition(
            origin.x + (Math.random() - 0.5) * 1.5,
            origin.y + 0.3 + Math.random() * 0.5,
            origin.z + (Math.random() - 0.5) * 1.5
          );

          piece.velocity = new pc.Vec3(
            (Math.random() - 0.5) * 18,
            8 + Math.random() * 12,
            -currentSpeed * 0.4 + (Math.random() - 0.5) * 10
          );

          piece.rotVelocity = new pc.Vec3(
            (Math.random() - 0.5) * 720,
            (Math.random() - 0.5) * 720,
            (Math.random() - 0.5) * 720
          );

          app.root.addChild(piece);
          brokenDebris.push(piece);
        }

        setTimeout(() => {
          alert(`💥 CRASH!\nScore: ${score}\nBest Score: ${highScore}\nTotal Gifts: ${giftCount}`);
          window.location.reload();
        }, 1200);
      }

      // Physics Loop
      let currentSpeed = 32;
      let yVelocity = 0;
      let isGrounded = true;
      let treesPassedCount = 0;
      let score = 0;
      let gameOver = false;

      app.on('update', (dt) => {
        // Animate debris during crash animation
        if (brokenDebris.length > 0) {
          brokenDebris.forEach((p) => {
            p.velocity.y += gravityValue * dt;
            const pos = p.getPosition();
            p.setPosition(
              pos.x + p.velocity.x * dt,
              Math.max(0.05, pos.y + p.velocity.y * dt),
              pos.z + p.velocity.z * dt
            );

            p.rotate(p.rotVelocity.x * dt, p.rotVelocity.y * dt, p.rotVelocity.z * dt);
          });
        }

        if (!gameStarted || gameOver || !currentUser) return;

        currentSpeed += dt * 0.95 * speedMult; 
        document.getElementById('speed-num').innerText = Math.floor(currentSpeed);

        const pos = playerGroup.getPosition();
        let moveX = pos.x;

        if (document.activeElement !== adminInput && document.activeElement !== usernameInput && document.activeElement !== passwordInput) {
          const leftPressed = app.keyboard.isPressed(pc.KEY_LEFT) || app.keyboard.isPressed(pc.KEY_A);
          const rightPressed = app.keyboard.isPressed(pc.KEY_RIGHT) || app.keyboard.isPressed(pc.KEY_D);

          if (invertControls) {
            if (leftPressed) moveX += 20 * dt;
            if (rightPressed) moveX -= 20 * dt;
          } else {
            if (leftPressed) moveX -= 20 * dt;
            if (rightPressed) moveX += 20 * dt;
          }

          const jumpPressed = app.keyboard.wasPressed(pc.KEY_SPACE) || 
                              app.keyboard.wasPressed(pc.KEY_W) || 
                              app.keyboard.wasPressed(pc.KEY_UP);

          if (jumpPressed && isGrounded) {
            yVelocity = currentSled.jump * jumpPowerMult;
            isGrounded = false;
          }
        }

        let newY = pos.y + yVelocity * dt;
        if (!isGrounded) yVelocity += gravityValue * dt;

        if (newY <= 0) {
          newY = 0;
          yVelocity = 0;
          isGrounded = true;
        }

        moveX = pc.math.clamp(moveX, -25, 25);
        const newZ = pos.z - (currentSpeed + (currentSled.baseSpeed - 32)) * dt;
        playerGroup.setPosition(moveX, newY, newZ);

        sledMesh.setLocalEulerAngles(0, 0, (pos.x - moveX) * 16);

        camera.camera.fov = cameraFovOverride > 0 ? cameraFovOverride : (62 + (currentSpeed * 0.12));
        camera.setPosition(moveX, newY + 2.4, newZ + 3.4);
        camera.setEulerAngles(-14, 0, 0);

        grounds.forEach((g) => {
          if (g.getPosition().z > newZ + 60) g.setPosition(0, -0.05, g.getPosition().z - 720);
        });

        // Recycling outer corner border trees
        borderTrees.forEach((bt) => {
          if (bt.getPosition().z > newZ + 10) {
            bt.setPosition(bt.getPosition().x, 0, bt.getPosition().z - 450);
          }
        });

        ramps.forEach((ramp) => {
          const rPos = ramp.getPosition();
          if (Math.abs(moveX - rPos.x) < 3.5 && Math.abs(newZ - rPos.z) < 2.8 && newY < 2.0) {
            yVelocity = (currentSled.jump + 8) * jumpPowerMult;
            isGrounded = false;
          }
          if (rPos.z > newZ + 10) {
            createRamp((Math.random() - 0.5) * 36, newZ - 300 - Math.random() * 50);
            app.root.removeChild(ramp);
            ramps.splice(ramps.indexOf(ramp), 1);
          }
        });

        gifts.forEach((g) => {
          const gPos = g.getPosition();
          g.rotate(0, 50 * dt, 0);

          if (giftMagnetMode) {
            const dir = pos.clone().sub(gPos).normalize().scale(30 * dt);
            g.setPosition(gPos.x + dir.x, gPos.y + dir.y, gPos.z + dir.z);
          }

          if (pos.distance(gPos) < 2.4) {
            giftCount += 1;
            document.getElementById('gifts').innerText = giftCount;
            saveUserData();
            app.root.removeChild(g);
            gifts.splice(gifts.indexOf(g), 1);
          } else if (gPos.z > newZ + 10) {
            createGift((Math.random() - 0.5) * 36, newZ - 220 - Math.random() * 80);
            app.root.removeChild(g);
            gifts.splice(gifts.indexOf(g), 1);
          }
        });

        const allObstacles = [...obstacles, ...borderTrees];
        allObstacles.forEach((tree) => {
          const tPos = tree.getPosition();

          if (!currentSled.immune && !globalGodmode) {
            if (Math.abs(moveX - tPos.x) < 2.2 && Math.abs(newZ - tPos.z) < 2.2 && newY < 8.0) {
              triggerCrashAnimation();
            }
          }

          if (!tree.passed && newZ < tPos.z) {
            tree.passed = true;
            treesPassedCount += 1;
            if (treesPassedCount % 3 === 0) {
              score += 1;
              document.getElementById('score').innerText = score;

              if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore;
                saveUserData();
              }
            }
          }

          if (obstacles.includes(tree) && tPos.z > newZ + 10) {
            createTree((Math.random() - 0.5) * 36, newZ - 200 - Math.random() * 40);
            app.root.removeChild(tree);
            obstacles.splice(obstacles.indexOf(tree), 1);
          }
        });
      });

      if (currentUser) loadUserData();
      app.start();
    });
  </script>
</body>
</html>
